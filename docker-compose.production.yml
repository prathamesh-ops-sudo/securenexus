version: "3.9"

# Production-ready docker-compose for single-node or small-scale deployments.
# For Kubernetes deployments, use the k8s/ manifests instead.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Prerequisites:
#   - Build the image first: docker build -t securenexus:latest .
#   - Create a .env file from .env.example with production values

services:
  app:
    image: securenexus:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const r=http.get('http://localhost:5000/api/ops/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: securenexus
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: securenexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenexus"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
    driver: local
