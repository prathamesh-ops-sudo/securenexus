name: CI/CD Pipeline

# PAUSED — re-enable push trigger when ready to resume CI
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securenexus
  EKS_CLUSTER: securenexus
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "20"

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

# =============================================================================
# DEPLOY PIPELINE
# - push to main  → typecheck → build + validate → deploy STAGING only (auto)
# - workflow_dispatch → typecheck → build + validate → deploy STAGING → UAT → PRODUCTION (manual)
# Includes post-merge checks: container security (55–64), k8s validation (85–94),
# performance budgets (103–106).
# =============================================================================
jobs:
  typecheck-gate:
    name: Typecheck Gate
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploy blocked — must be triggered from main branch (got ${{ github.ref }})"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  build-and-push:
    name: Build & Push to ECR
    needs: typecheck-gate
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: deploy-build
      cancel-in-progress: false
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Post-Merge: Container & Supply Chain (checks 55–64)
  # ---------------------------------------------------------------------------
  container-security:
    name: "Container Security"
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check 56: Trivy — CRITICAL CVEs in image
      - name: "[56] Trivy CRITICAL CVE scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}
          severity: CRITICAL
          exit-code: "1"
          format: table
        continue-on-error: true

      # Check 58: No root user in container
      - name: "[58] Verify non-root user in Dockerfile"
        run: |
          if grep -q '^USER' Dockerfile; then
            USER_LINE=$(grep '^USER' Dockerfile | tail -1)
            if echo "$USER_LINE" | grep -qi 'root'; then
              echo "::error::Container runs as root"
              exit 1
            fi
            echo "Container user: $USER_LINE"
          else
            echo "::error::No USER directive in Dockerfile — container runs as root"
            exit 1
          fi

      # Check 59: Multi-stage build verification
      - name: "[59] Multi-stage build verification"
        run: |
          STAGES=$(grep -c '^FROM' Dockerfile)
          if [ "$STAGES" -lt 2 ]; then
            echo "::error::Dockerfile does not use multi-stage build ($STAGES stage(s))"
            exit 1
          fi
          echo "Multi-stage build confirmed ($STAGES stages)"

      # Check 60: .dockerignore completeness
      - name: "[60] .dockerignore completeness"
        run: |
          MISSING=""
          for PATTERN in '.env' '*.pem' '*.key' '.git'; do
            if ! grep -q "$PATTERN" .dockerignore 2>/dev/null; then
              MISSING="$MISSING $PATTERN"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing patterns in .dockerignore:$MISSING"
          else
            echo ".dockerignore is complete"
          fi

      # Check 61: No secrets in Docker layer history
      - name: "[61] No secrets in Dockerfile build args"
        run: |
          FOUND=$(grep -in 'ARG.*SECRET\|ARG.*PASSWORD\|ARG.*KEY' Dockerfile || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Secrets passed as build args (will be in layer history):"
            echo "$FOUND"
            exit 1
          fi
          echo "No secrets in build args"

  # ---------------------------------------------------------------------------
  # Post-Merge: Kubernetes Validation (checks 85–94)
  # ---------------------------------------------------------------------------
  k8s-validation:
    name: "Kubernetes Validation"
    needs: typecheck-gate
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check 85: kubeconform validation
      - name: "[85] Install kubeconform"
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: "[85] Validate k8s manifests"
        run: |
          find k8s/ -name '*.yml' -o -name '*.yaml' | while read f; do
            echo "Validating $f..."
            kubeconform -strict -summary "$f" 2>&1 || true
          done

      # Check 87: CPU/memory limits set on all containers
      - name: "[87] CPU/memory limits present"
        run: |
          MISSING=$(grep -rL 'resources:' k8s/ --include='*.yml' | grep -i 'rollout\|deployment' || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing resource limits in:"
            echo "$MISSING"
          else
            echo "All deployment manifests have resource limits"
          fi

      # Check 88: Liveness and readiness probes present
      - name: "[88] Liveness/readiness probes present"
        run: |
          for PROBE in livenessProbe readinessProbe; do
            MISSING=$(grep -rL "$PROBE" k8s/ --include='*.yml' | grep -i 'rollout\|deployment' || true)
            if [ -n "$MISSING" ]; then
              echo "::warning::Missing $PROBE in: $MISSING"
            fi
          done

      # Check 89: PodDisruptionBudget present for production
      - name: "[89] PDB present for production"
        run: |
          if [ ! -f k8s/production/pdb.yml ]; then
            echo "::warning::k8s/production/pdb.yml not found"
          else
            echo "PDB file present"
          fi

      # Check 91: No privileged containers
      - name: "[91] No privileged containers"
        run: |
          FOUND=$(grep -rn 'privileged: true' k8s/ --include='*.yml' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Privileged containers found:"
            echo "$FOUND"
            exit 1
          fi
          echo "No privileged containers"

      # Check 92: No hostPath volumes
      - name: "[92] No hostPath volumes"
        run: |
          FOUND=$(grep -rn 'hostPath' k8s/ --include='*.yml' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::hostPath volumes found:"
            echo "$FOUND"
            exit 1
          fi
          echo "No hostPath volumes"

  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push, container-security, k8s-validation]
    runs-on: self-hosted
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Sync secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id securenexus/staging --query SecretString --output text)
          kubectl create secret generic securenexus-secrets \
            --namespace=staging \
            --from-literal="DATABASE_URL=$(echo "$SECRET_JSON" | jq -r '.DATABASE_URL')" \
            --from-literal="SESSION_SECRET=$(echo "$SECRET_JSON" | jq -r '.SESSION_SECRET')" \
            --from-literal="S3_BUCKET_NAME=$(echo "$SECRET_JSON" | jq -r '.S3_BUCKET_NAME')" \
            --from-literal="AWS_REGION=$(echo "$SECRET_JSON" | jq -r '.AWS_REGION')" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        run: |
          set -euo pipefail
          export IMAGE=${{ needs.build-and-push.outputs.image }}
          kubectl apply -f k8s/base/network-policy.yml
          envsubst < k8s/staging/rollout.yml | kubectl apply -f -
          kubectl apply -f k8s/staging/service.yml
          kubectl -n staging rollout status deployment/securenexus --timeout=300s

      - name: Smoke test staging
        run: |
          set -euo pipefail
          STAGING_URL=$(kubectl get svc securenexus -n staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${STAGING_URL}/api/ops/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging smoke test passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $STATUS - waiting 10s..."
            sleep 10
          done
          echo "Staging smoke test failed after 12 attempts"
          exit 1

  deploy-uat:
    name: Deploy to UAT
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-push, deploy-staging]
    runs-on: self-hosted
    timeout-minutes: 20
    environment: uat
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Sync secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id securenexus/uat --query SecretString --output text)
          kubectl create secret generic securenexus-secrets \
            --namespace=uat \
            --from-literal="DATABASE_URL=$(echo "$SECRET_JSON" | jq -r '.DATABASE_URL')" \
            --from-literal="SESSION_SECRET=$(echo "$SECRET_JSON" | jq -r '.SESSION_SECRET')" \
            --from-literal="S3_BUCKET_NAME=$(echo "$SECRET_JSON" | jq -r '.S3_BUCKET_NAME')" \
            --from-literal="AWS_REGION=$(echo "$SECRET_JSON" | jq -r '.AWS_REGION')" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to UAT
        run: |
          set -euo pipefail
          export IMAGE=${{ needs.build-and-push.outputs.image }}
          kubectl apply -f k8s/base/network-policy.yml
          envsubst < k8s/uat/rollout.yml | kubectl apply -f -
          kubectl apply -f k8s/uat/service.yml
          kubectl -n uat rollout status deployment/securenexus --timeout=300s

  deploy-production:
    name: Deploy to Production (Argo Rollout)
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-push, deploy-staging, deploy-uat]
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Install Argo Rollouts kubectl plugin
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            ARGO_ARCH="arm64"
          else
            ARGO_ARCH="amd64"
          fi
          curl -LO "https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-${ARGO_ARCH}"
          chmod +x "kubectl-argo-rollouts-linux-${ARGO_ARCH}"
          sudo mv "kubectl-argo-rollouts-linux-${ARGO_ARCH}" /usr/local/bin/kubectl-argo-rollouts

      - name: Sync secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id securenexus/production --query SecretString --output text)
          kubectl create secret generic securenexus-secrets \
            --namespace=production \
            --from-literal="DATABASE_URL=$(echo "$SECRET_JSON" | jq -r '.DATABASE_URL')" \
            --from-literal="SESSION_SECRET=$(echo "$SECRET_JSON" | jq -r '.SESSION_SECRET')" \
            --from-literal="S3_BUCKET_NAME=$(echo "$SECRET_JSON" | jq -r '.S3_BUCKET_NAME')" \
            --from-literal="AWS_REGION=$(echo "$SECRET_JSON" | jq -r '.AWS_REGION')" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy production via Argo Rollout
        run: |
          set -euo pipefail
          export IMAGE=${{ needs.build-and-push.outputs.image }}
          kubectl apply -f k8s/base/network-policy.yml
          kubectl apply -f k8s/production/pdb.yml
          envsubst < k8s/production/rollout.yml | kubectl apply -f -
          kubectl apply -f k8s/production/service.yml

      - name: Wait for rollout
        run: kubectl argo rollouts status securenexus -n production --timeout 600

      - name: Smoke test production
        run: |
          set -euo pipefail
          PROD_URL=$(kubectl get svc securenexus-stable -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${PROD_URL}/api/ops/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production smoke test passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $STATUS - waiting 10s..."
            sleep 10
          done
          echo "Production smoke test failed after 12 attempts"
          exit 1
