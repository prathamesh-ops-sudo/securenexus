name: Auto-Approve & Auto-Merge Devin PRs

# PAUSED — re-enable pull_request trigger when ready to resume CI
on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve-and-merge:
    name: Auto-Approve & Enable Auto-Merge
    if: github.actor == 'devin-ai-integration[bot]'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gh CLI
        run: |
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi

      - name: Enable auto-merge
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
