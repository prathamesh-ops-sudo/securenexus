name: UAT Gate

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Staging URL for smoke tests (e.g. https://staging.aricatech.xyz)"
        required: false
        default: "https://staging.aricatech.xyz"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  security-events: write

# =============================================================================
# UAT GATE — final validation before production promotion
# Implements checks 26–27 (API smoke), 56–57 (Trivy HIGH), 107–110 (observability)
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # API Smoke Tests (checks 26–27)
  # ---------------------------------------------------------------------------
  api-smoke:
    name: "API Smoke Tests"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      # Check 26: Health endpoint responds 200
      - name: "[26] Health endpoint responds 200"
        run: |
          STAGING_URL="${{ github.event.inputs.staging_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/ops/health" 2>/dev/null || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $STATUS"
            exit 1
          fi
          echo "Health endpoint OK (HTTP 200)"

      # Check 27: Critical API routes reachable
      - name: "[27] Critical API routes reachable"
        run: |
          STAGING_URL="${{ github.event.inputs.staging_url }}"
          ROUTES=(
            "/api/ops/health"
          )
          FAILED=0
          for ROUTE in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}${ROUTE}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
              echo "::error::Route ${ROUTE} returned HTTP $STATUS"
              FAILED=1
            else
              echo "Route ${ROUTE} OK (HTTP $STATUS)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Container Security — HIGH severity (checks 56–57)
  # ---------------------------------------------------------------------------
  container-security-high:
    name: "Container Security (HIGH)"
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: securenexus:uat-scan

      # Check 56–57: Trivy HIGH + CRITICAL CVEs
      - name: "[56-57] Trivy HIGH+CRITICAL CVE scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securenexus:uat-scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Observability (checks 107–110)
  # ---------------------------------------------------------------------------
  observability:
    name: "Observability Checks"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check 107: All new API routes have structured logging
      - name: "[107] API routes have structured logging"
        run: |
          ROUTE_COUNT=$(grep -rn 'app\.\(get\|post\|put\|delete\|patch\)(' server/routes/ --include='*.ts' | wc -l)
          LOG_COUNT=$(grep -rn 'log\.\(info\|error\|warn\|debug\)' server/routes/ --include='*.ts' | wc -l)
          echo "Routes: $ROUTE_COUNT, Log statements: $LOG_COUNT"
          if [ "$LOG_COUNT" -lt "$ROUTE_COUNT" ]; then
            echo "::warning::Some routes may lack structured logging (routes=$ROUTE_COUNT, logs=$LOG_COUNT)"
          fi

      # Check 108: SLO alerting rules valid YAML
      - name: "[108] Alerting rules YAML validation"
        run: |
          if [ -f k8s/monitoring/alerting-rules.yml ]; then
            npx js-yaml k8s/monitoring/alerting-rules.yml > /dev/null 2>&1 || {
              echo "::error::alerting-rules.yml is not valid YAML"
              exit 1
            }
            echo "alerting-rules.yml is valid YAML"
          else
            echo "::warning::k8s/monitoring/alerting-rules.yml not found"
          fi

      # Check 109: Prometheus metrics endpoint reachable (staging smoke)
      - name: "[109] Metrics endpoint check"
        run: |
          STAGING_URL="${{ github.event.inputs.staging_url }}"
          if [ -n "$STAGING_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/ops/metrics" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Metrics endpoint OK"
            else
              echo "::warning::Metrics endpoint returned HTTP $STATUS"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Verdict
  # ---------------------------------------------------------------------------
  uat-verdict:
    name: "UAT Gate Verdict"
    needs: [api-smoke, container-security-high, observability]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        run: |
          echo "============================================"
          echo "  UAT GATE RESULTS"
          echo "============================================"
          echo ""
          echo "  API Smoke:          ${{ needs.api-smoke.result }}"
          echo "  Container Security: ${{ needs.container-security-high.result }}"
          echo "  Observability:      ${{ needs.observability.result }}"
          echo ""
          echo "============================================"

          FAILED=0
          for result in \
            "${{ needs.api-smoke.result }}" \
            "${{ needs.container-security-high.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::UAT Gate failed — fix issues before promoting to production"
            exit 1
          fi
          echo "UAT Gate passed — safe to promote to production"
