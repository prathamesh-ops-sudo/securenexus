name: Weekly Codebase Sweep

# PAUSED — re-enable schedule + workflow_dispatch triggers when ready to resume CI
on:
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: 10

permissions:
  contents: read
  security-events: write
  actions: read

# =============================================================================
# WEEKLY SWEEP — catches slow-burn issues that don't fail fast
# Implements full security suite (checks 33–54), quality, testing, docker,
# dependency, and k8s validation checks.
# All jobs run on self-hosted AWS runners for unlimited CI minutes.
# =============================================================================
jobs:
  quality:
    name: "Code Quality (Lint + Typecheck + Prettier)"
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check 1: TypeScript strict typecheck
      - name: "[1] TypeScript strict typecheck"
        run: npx tsc --noEmit

      # Check 2: ESLint (errors are fatal)
      - name: "[2] ESLint (errors fatal)"
        run: npx eslint . --quiet

      # Check 3: Prettier format verification
      - name: "[3] Prettier format verification"
        run: npx prettier --check "server/**/*.ts" "client/src/**/*.{ts,tsx}" "shared/**/*.ts"

      # Check 9: No debugger statements
      - name: "[9] No debugger statements"
        run: |
          FOUND=$(grep -rn 'debugger' server/ client/src/ shared/ --include='*.ts' --include='*.tsx' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::debugger statements found:"
            echo "$FOUND"
            exit 1
          fi

      # Check 14: No TODO/FIXME in security-critical paths
      - name: "[14] TODO/FIXME in security paths"
        run: |
          FOUND=$(grep -rn 'TODO\|FIXME' server/auth/ server/rbac.ts 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::warning::TODO/FIXME in security-critical paths:"
            echo "$FOUND"
          fi

  # ---------------------------------------------------------------------------
  # Full Security Suite (checks 33–54)
  # ---------------------------------------------------------------------------
  security:
    name: "Security Scanning (Full Suite)"
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check 33: Gitleaks secret scanning (full history)
      - name: "[33] Cleanup stale gitleaks tmp"
        run: rm -f /tmp/gitleaks.tmp
      - name: "[33] Gitleaks secret scanning"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        continue-on-error: true

      # Check 34: npm audit — critical severity
      - name: "[34] npm audit (critical)"
        run: |
          CRITICAL_COUNT=$(npm audit --omit=dev --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::$CRITICAL_COUNT critical vulnerabilities found"
            npm audit --omit=dev --audit-level=critical 2>&1
            exit 1
          fi
          echo "No critical vulnerabilities"

      # Check 35: npm audit — high severity
      - name: "[35] npm audit (high)"
        run: |
          HIGH_COUNT=$(npm audit --omit=dev --json 2>/dev/null | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::warning::$HIGH_COUNT high-severity vulnerabilities found"
            npm audit --omit=dev --audit-level=high 2>&1 || true
          fi

      # Check 37: Hardcoded secret pattern scan (expanded patterns)
      - name: "[37] Hardcoded secret pattern scan"
        run: |
          set -euo pipefail
          PATTERNS=(
            'AKIA[A-Z0-9]{16}'
            'ghp_[A-Za-z0-9]{36}'
            'snx_[a-f0-9]{64}'
            'sk-[A-Za-z0-9]{48}'
            'xoxb-[0-9]+'
          )
          FOUND=0
          for pat in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' -E "$pat" server/ client/ shared/ 2>/dev/null | grep -v node_modules | grep -v '\.test\.' | grep -v 'REDACTED' | grep -v 'pattern' | grep -v 'RegExp' || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Potential secret pattern found: $pat"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      # Check 38: .env files not committed
      - name: "[38] No .env files committed"
        run: |
          FOUND=$(git ls-files | grep '\.env' | grep -v '.env.example' | grep -v '.env.sample' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::.env files committed to repo:"
            echo "$FOUND"
            exit 1
          fi
          echo "No .env files committed"

      # Check 39: No eval() usage
      - name: "[39] No eval() usage"
        run: |
          FOUND=$(grep -rn '\beval(' server/ client/src/ shared/ --include='*.ts' --include='*.tsx' | grep -v 'node_modules' | grep -v '\.test\.' | grep -v '// eslint' | grep -v 'remediation' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::eval() usage found:"
            echo "$FOUND"
            exit 1
          fi

      # Check 40: No dangerouslySetInnerHTML
      # Allowed: chart.tsx (CSS styles), content-layout.tsx (JSON-LD structured data)
      - name: "[40] No dangerouslySetInnerHTML"
        run: |
          FOUND=$(grep -rn 'dangerouslySetInnerHTML' client/src/ --include='*.tsx' --include='*.ts' | grep -v 'chart\.tsx' | grep -v 'content-layout\.tsx' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::dangerouslySetInnerHTML usage found:"
            echo "$FOUND"
            exit 1
          fi

      # Check 41: SQL injection pattern scan
      - name: "[41] SQL injection patterns"
        run: |
          FOUND=$(grep -rn 'db\.execute.*\$\{' server/ --include='*.ts' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Template-literal SQL detected:"
            echo "$FOUND"
            exit 1
          fi

      # Check 43: Math.random() in security context
      - name: "[43] No Math.random() in security context"
        run: |
          FOUND=$(grep -rn 'Math\.random' server/auth/ server/routes/ --include='*.ts' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Math.random() in security context:"
            echo "$FOUND"
            exit 1
          fi

      # Check 44: CSRF middleware present
      - name: "[44] CSRF middleware verification"
        run: |
          FOUND=$(grep -rn 'csrf\|csrfToken\|X-CSRF' server/ --include='*.ts' || true)
          if [ -z "$FOUND" ]; then
            echo "::warning::No CSRF middleware detected"
          else
            echo "CSRF middleware present"
          fi

      # Check 45: Helmet security headers
      - name: "[45] Helmet security headers"
        run: |
          FOUND=$(grep -rn 'helmet\|contentSecurityPolicy\|X-Frame-Options' server/ --include='*.ts' || true)
          if [ -z "$FOUND" ]; then
            echo "::warning::No helmet/CSP headers detected"
          else
            echo "Security headers configured"
          fi

      # Check 50: No hardcoded CORS origins
      - name: "[50] No hardcoded CORS origins"
        run: |
          FOUND=$(grep -rn "origin.*localhost\|origin.*127\.0\.0\.1" server/ --include='*.ts' | grep -v 'process.env\|NODE_ENV.*dev\|// ' || true)
          if [ -n "$FOUND" ]; then
            echo "::warning::Possible hardcoded CORS origins:"
            echo "$FOUND"
          fi

  codeql:
    name: "CodeQL SAST"
    runs-on: ubuntu-latest # CodeQL requires ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check 36: CodeQL analysis
      - name: "[36] Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: "[36] Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  unit-tests:
    name: "Unit Tests + Coverage"
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check 17–21: Unit tests
      - name: "[17] Run unit tests"
        run: npx vitest run --reporter=verbose

  e2e-tests:
    name: "E2E Tests"
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npx vite build

      # Check 24–25: E2E tests
      - name: "[24] Run E2E tests"
        run: npx playwright test --reporter=github
        env:
          CI: true

  # ---------------------------------------------------------------------------
  # Docker Build + Container Security (checks 55–64)
  # ---------------------------------------------------------------------------
  docker-build:
    name: "Docker Build + Container Security"
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Check 55: Docker build succeeds
      - name: "[55] Build Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: securenexus:weekly-${{ github.sha }}

      # Check 56–57: Trivy CVE scan
      - name: "[56-57] Trivy CVE scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securenexus:weekly-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      # Check 58: Non-root user
      - name: "[58] Verify non-root user in Dockerfile"
        run: |
          if ! grep -q '^USER' Dockerfile; then
            echo "::error::No USER directive in Dockerfile"
            exit 1
          fi

      # Check 59: Multi-stage build
      - name: "[59] Multi-stage build"
        run: |
          STAGES=$(grep -c '^FROM' Dockerfile)
          if [ "$STAGES" -lt 2 ]; then
            echo "::error::Not a multi-stage build"
            exit 1
          fi
          echo "Multi-stage build ($STAGES stages)"

      # Check 60: .dockerignore
      - name: "[60] .dockerignore completeness"
        run: |
          for PATTERN in '.env' '.git' 'node_modules'; do
            if ! grep -q "$PATTERN" .dockerignore 2>/dev/null; then
              echo "::warning::Missing $PATTERN in .dockerignore"
            fi
          done

  # ---------------------------------------------------------------------------
  # Dependency Checks (checks 65–74)
  # ---------------------------------------------------------------------------
  dependencies:
    name: "Dependency Checks"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check 65: License compliance
      - name: "[65] License compliance"
        run: |
          npx license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;CC-BY-4.0;CC-BY-3.0;Unlicense;BlueOak-1.0.0;Python-2.0;(MIT AND CC-BY-3.0);(MIT OR CC0-1.0);WTFPL;Artistic-2.0" --production 2>&1 || {
            echo "::warning::Some packages have non-standard licenses"
          }

      # Check 66: Check for deprecated packages
      - name: "[66] Check for deprecated packages"
        run: |
          npm outdated --json 2>/dev/null | jq -r 'to_entries[] | select(.value.current != .value.latest) | "\(.key): \(.value.current) -> \(.value.latest)"' 2>/dev/null | head -20 || true

  # ---------------------------------------------------------------------------
  # Kubernetes Validation (checks 85–94)
  # ---------------------------------------------------------------------------
  k8s-validation:
    name: "Kubernetes Validation"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check 85: kubeconform
      - name: "[85] Install kubeconform"
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: "[85] Validate k8s manifests"
        run: |
          find k8s/ -name '*.yml' -o -name '*.yaml' | while read f; do
            echo "Validating $f..."
            kubeconform -strict -summary "$f" 2>&1 || true
          done

      # Check 91: No privileged containers
      - name: "[91] No privileged containers"
        run: |
          FOUND=$(grep -rn 'privileged: true' k8s/ --include='*.yml' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Privileged containers found:"
            echo "$FOUND"
            exit 1
          fi

      # Check 92: No hostPath volumes
      - name: "[92] No hostPath volumes"
        run: |
          FOUND=$(grep -rn 'hostPath' k8s/ --include='*.yml' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::hostPath volumes found:"
            echo "$FOUND"
            exit 1
          fi

  sweep-verdict:
    name: "Weekly Sweep Verdict"
    needs: [quality, security, codeql, unit-tests, e2e-tests, docker-build, dependencies, k8s-validation]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Report results
        run: |
          echo "============================================"
          echo "  WEEKLY CODEBASE SWEEP RESULTS"
          echo "============================================"
          echo ""
          echo "  Quality:         ${{ needs.quality.result }}"
          echo "  Security:        ${{ needs.security.result }}"
          echo "  CodeQL:          ${{ needs.codeql.result }}"
          echo "  Unit Tests:      ${{ needs.unit-tests.result }}"
          echo "  E2E Tests:       ${{ needs.e2e-tests.result }}"
          echo "  Docker Build:    ${{ needs.docker-build.result }}"
          echo "  Dependencies:    ${{ needs.dependencies.result }}"
          echo "  K8s Validation:  ${{ needs.k8s-validation.result }}"
          echo ""
          echo "============================================"
          FAILED=0
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.e2e-tests.result }}" \
            "${{ needs.docker-build.result }}" \
            "${{ needs.dependencies.result }}" \
            "${{ needs.k8s-validation.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more sweep checks failed - review required"
            exit 1
          fi
          echo "All sweep checks passed"
