name: Auto-Approve Devin PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    name: Auto-Approve Devin PRs
    if: github.actor == 'devin-ai-integration[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
