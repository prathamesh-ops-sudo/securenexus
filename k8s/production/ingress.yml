apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securenexus-ingress
  namespace: production
  labels:
    app.kubernetes.io/name: securenexus
    app.kubernetes.io/part-of: securenexus
    app: securenexus
    environment: production
  annotations:
    # TLS termination via AWS ALB or nginx-ingress
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limiting at ingress level (defense in depth with app-level rate limit)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Request body size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  tls:
    - hosts:
        - app.aricatech.xyz
      secretName: securenexus-tls
  rules:
    - host: app.aricatech.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securenexus-stable
                port:
                  number: 80
---
# Staging ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securenexus-ingress
  namespace: staging
  labels:
    app.kubernetes.io/name: securenexus
    app.kubernetes.io/part-of: securenexus
    app: securenexus
    environment: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - staging.aricatech.xyz
      secretName: securenexus-staging-tls
  rules:
    - host: staging.aricatech.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securenexus-stable
                port:
                  number: 80
